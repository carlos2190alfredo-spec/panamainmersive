# CI de Panamá Immersive. ESTADO: VERIFIED en GitHub, pero solo sobre lo ANTERIOR a la entrega 5j: corrió en verde el
# 2026-10-24 (push a `main`, `a0f9fd5`, y PR #6, `6193226`; docs/deploy.md §7, E-98). Los commits de 5j y de su revisión
# independiente no estaban en `origin` cuando se escribió esto: ese CI no los ha visto. Los MISMOS comandos se ejecutan
# en local (ver docs/testing.md) y la estructura de este archivo está vigilada por `tests/unit/scripts/ci-workflow.test.ts`
# (guardas textuales, no una ejecución).
#
# LIMITACIONES CONOCIDAS (honestas, no ocultas en el nombre de un job verde):
#  · Este CI NO genera el mapa base (`public/data/panama-basemap.pmtiles`: Python + tippecanoe + red hacia Overture,
#    ≈ 5 min). Sin él, las pruebas E2E que necesitan el mapa dibujado se OMITEN diciéndolo. Medido en local ocultando el
#    fichero, 2026-10-27 (revisión X1 de 5j, `--workers=3`): 272 pasan, 101 omitidas (todas por esa causa), 1 falla y 1 intermitente, las dos ANTERIORES a X1 y solo bajo carga (la que fallaba, «teclado en pantalla» de la hoja móvil, era una carrera de `settled()` y ya está corregida: 24 de 24 con 4 trabajadores, antes 5 de 24 y 4 de 24 sobre el build anterior; la intermitente son las flechas del carrusel: ver docs/progress.md, «X1»); con el mapa, 375 pasan y 0 fallan; antes 255 y 81 (2026-10-26), 254 y 80, 225 y 75; 2026-10-25: 184 y 66; 2026-10-24: 138 y 57; entre
#    medias entraron las pruebas del HUD de Explorar, las de la portada, las de sus interacciones —filtro, buscador y 3D— y las de la hoja móvil). `pnpm check:e2e-skips` limita las
#    omitidas a ese número: otra omisión nueva ya no pasa desapercibida.
#    X2 (revisión de 5j, 2026-11-03): +8 pruebas que necesitan el mapa (6 de escritorio y 2 de móvil: aviso previo del 3D, apagado del 3D,
#    nombres de los marcadores, Escape, vuelo de la búsqueda y créditos de MapLibre) → techo 101 → 109; medido solo sobre sus dos archivos (8 omitidas de 19), no con la suite entera sin mapa.
#    X5 (revisión de CSS y accesibilidad de 5j, 2026-11-11): +5 pruebas que necesitan el mapa (2 de escritorio: aviso del mapa frente al panel abierto y tipografía de los marcadores; 3 de móvil: el aviso
#    previo del 3D a 320 px, con «Sombreado» y en tableta táctil) → techo 109 → 114; medido solo sobre esas cinco con el fichero oculto (5 omitidas de 5), no con la suite entera sin mapa.
#    ADR-0027 A1 («Recorrido 3D», 2026-11-11): +5 pruebas que necesitan el mapa (4 de escritorio en `e2e/explore-tour.spec.ts`: opt-in y detener, gesto que interrumpe, otro destino,
#    movimiento reducido; 1 de móvil en `e2e/explore-tour.mobile.spec.ts`: pliega la hoja y deja el destino a la vista) → techo 114 → 119; medido solo sobre esos archivos con el fichero oculto, no con la suite entera sin mapa.
#    ACTUALIZACIÓN 2026-10-24: el fichero ahora SÍ está versionado (staging de Vercel, docs/deploy.md §4), así que este CI
#    lo encuentra en el checkout y EJECUTA esas pruebas (el límite de omitidas es un máximo, no un mínimo).
#    OBSERVADO en GitHub (2026-10-24, run 40131580748 sobre `6193226`, ubuntu-24.04, Chromium 156.0.8078.4): 195 pasan,
#    0 omitidas, 0 fallan, 0 intermitentes: las pruebas con WebGL SÍ corren en el runner. Por eso el techo de abajo solo
#    describe un clon SIN el fichero, y el NOMBRE de este job («mapa base NO generado en CI…») quedó desactualizado:
#    sigue diciendo que el CI no lo genera (cierto: lo trae el checkout) y que sus pruebas se omiten (hoy: ninguna). No
#    se renombró porque `scripts/mutation/ci.py` (Y12) cita el nombre literalmente.
#  · `pnpm test:e2e:db` NO está en este flujo: necesita artefactos de datos gitignorados (`pnpm data:build` y
#    `pnpm data:ingest`) que el CI no genera, y en CI «faltan datos» es un FALLO (un verde que no ejecutó nada es peor
#    que un rojo), así que añadirlo sin generarlos lo dejaría siempre en rojo. Se ejecuta en local (docs/testing.md).
#  · Las acciones de terceros van FIJADAS por hash de commit (F4-17b), con su versión en el comentario: una etiqueta como
#    `@v4` se puede reasignar. Los hashes se leyeron del repositorio de cada acción (`git ls-remote`, 2026-10-24: E-86) y
#    `pnpm check:action-pins --online` lo repite. `pnpm test` vigila la forma (`tests/unit/scripts/action-pins.test.ts`).
#    `.github/dependabot.yml` los actualiza, pero SOLO hará algo cuando exista un remoto con Dependabot activado: sin él los
#    hashes envejecen sin aviso (y sin parches de seguridad de las acciones).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# En `main` NO se cancela: un commit ya integrado se quedaría sin veredicto si llega otro encima.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Tipos, lint, formato y pruebas unitarias
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test
      - run: pnpm check:licenses

  pipelines:
    name: Pipelines de datos (pytest, sin red)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pipelines/requirements.txt
            pipelines/requirements-dev.txt
      - run: pip install -r pipelines/requirements.txt -r pipelines/requirements-dev.txt
      - run: python -I -m pytest pipelines/tests -q -p no:cacheprovider

  integration:
    name: Integración (PostgreSQL 16 + PostGIS, RLS y migraciones)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Las pruebas levantan su propio clúster temporal (sin servicios): solo necesitan los binarios.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-16-postgis-3
      - run: pnpm install --frozen-lockfile
      - name: Versiones
        run: |
          node --version
          pnpm --version
          /usr/lib/postgresql/16/bin/postgres --version
          dpkg-query --show --showformat='postgis ${Version}\n' postgresql-16-postgis-3
      - run: pnpm test:integration

  e2e:
    name: Build, presupuesto de bundle y E2E (mapa base NO generado en CI; sus pruebas se omiten con presupuesto)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Versiones
        run: |
          node --version
          pnpm --version
          pnpm exec playwright --version
      - run: pnpm build
        env:
          SITE_ENV: development
      - run: pnpm check:bundle
      - run: pnpm test:e2e
        env:
          CI: 'true'
          SITE_ENV: development
      # 119 = las pruebas que necesitan el mapa base (ver arriba). Es un TECHO para un clon sin el fichero, no el valor
      # esperado: con el mapa versionado el CI mide 0 omitidas.
      - name: Presupuesto de pruebas omitidas
        run: pnpm check:e2e-skips
        env:
          E2E_MAX_SKIPPED: '119'
      - name: Trazas de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e-content:
    name: E2E de la ficha con contenido verificado (PostgreSQL temporal → exportación → build → Next)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Necesita los binarios de PostgreSQL (clúster temporal) y Chromium; construye su PROPIA copia de la aplicación
      # con contenido sintético, así que no depende del build anterior ni de los datos del mapa.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-16-postgis-3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Versiones
        run: |
          node --version
          pnpm --version
          pnpm exec playwright --version
          /usr/lib/postgresql/16/bin/postgres --version
      - run: pnpm test:e2e:content
        env:
          CI: 'true'
      - name: Trazas de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-content-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # El ÚNICO check que haría falta exigir en la protección de rama: resume a todos y se ejecuta siempre (un job cuyo
  # `needs` falló queda «omitido», que GitHub no pinta de rojo).
  ci-ok:
    name: CI (resultado de todos los jobs)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [check, pipelines, integration, e2e, e2e-content]
    if: ${{ always() }}
    steps:
      - name: Algún job falló, se canceló o se omitió
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "::error::Algún job no terminó en éxito."
          echo "$NEEDS"
          exit 1
