# CI de Panamá Immersive. ESTADO: IMPLEMENTED, no VERIFIED: este flujo no se ha podido ejecutar fuera
# del entorno de desarrollo. Los MISMOS comandos sí se ejecutan en local (ver docs/testing.md).
# LIMITACIÓN CONOCIDA: este CI NO genera el mapa base (`public/data/panama-basemap.pmtiles`: Python + tippecanoe +
# red hacia Overture, ≈ 5 min). Sin él, los E2E que necesitan el mapa dibujado se OMITEN diciéndolo (verificado en
# local ocultando el fichero: 104 pasan, 56 omitidas, 0 fallan). El mapa real solo se verifica en local (backlog F3-14).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tipos, lint, formato y pruebas unitarias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm test

  pipelines:
    name: Pipelines de datos (pytest, sin red)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pipelines/requirements.txt
            pipelines/requirements-dev.txt
      - run: pip install -r pipelines/requirements.txt -r pipelines/requirements-dev.txt
      - run: python -I -m pytest pipelines/tests -q -p no:cacheprovider

  integration:
    name: Integración (PostgreSQL 16 + PostGIS, RLS y migraciones)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Las pruebas levantan su propio clúster temporal (sin servicios): solo necesitan los binarios.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-16-postgis-3
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    name: Compilación, presupuesto de bundle, E2E y accesibilidad
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          SITE_ENV: development
      - run: pnpm check:bundle
      - run: pnpm test:e2e
        env:
          CI: 'true'
          SITE_ENV: development

  e2e-content:
    name: E2E de la ficha con contenido verificado (PostgreSQL temporal → exportación → build → Next)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Necesita los binarios de PostgreSQL (clúster temporal) y Chromium; construye su PROPIA copia de la aplicación
      # con contenido sintético, así que no depende del build anterior ni de los datos del mapa.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-16-postgis-3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:content
        env:
          CI: 'true'
