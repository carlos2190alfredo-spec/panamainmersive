# Vigilancia semanal: avisos de las dependencias (T-20) y vigencia de la evidencia de cobertura (T-19).
# ESTADO: IMPLEMENTED, no VERIFIED: no se ha podido ejecutar fuera del entorno de desarrollo (no hay remoto). Los mismos
# comandos (`pnpm check:audit`, `pnpm check:coverage`) sí se ejecutan en local (docs/testing.md).
#
# Va APARTE de ci.yml a propósito: la base de avisos de seguridad cambia aunque el código no cambie, y un aviso nuevo
# sobre algo que no tiene relación con un cambio no debe bloquearlo (PROMPT-MAESTRO §18). Las licencias, que sí son
# deterministas, se comprueban en cada cambio (job `check` de ci.yml). La política (umbrales y excepciones con motivo y
# plazo) está en `data/dependency-policy.json`.
#
# El job `coverage` falla cuando la evidencia de cobertura caduca en menos de 30 días (o ya caducó): el Experience
# Resolver la trata como «sin saber» el día de la caducidad. Reobservar la cobertura sigue siendo trabajo manual
# (docs/coverage.md); esto solo evita que la fecha pase sin que nadie la vea. Cambia con el calendario, no con el código.
#
# Limitaciones: GitHub solo ejecuta los flujos programados desde la rama por defecto y los desactiva tras 60 días sin
# actividad en el repositorio; un flujo desactivado no avisa de nada. `workflow_dispatch` permite lanzarlo a mano.
name: Vigilancia semanal

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Avisos de seguridad de las dependencias (producción y desarrollo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:audit

  coverage:
    name: Evidencia de cobertura vigente (caduca en menos de 30 días = fallo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:coverage
